<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>As-Salaam Recitations Preview</title><style>:root{--bg:#1f1911;--ink:#f8f1e5;--muted:#ddd4c1;--accent:#d3b471}*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}.stage{position:fixed;inset:0;overflow:hidden;background:#100d09}.scene{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .5s ease}.scene.active{opacity:1}.scene img,.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scene video{z-index:1}.shade{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(10,8,5,.78),rgba(10,8,5,.1) 65%,rgba(10,8,5,.3))}.progress{position:fixed;z-index:20;top:0;left:0;width:100%;height:3px;background:#ffffff20}.progress i{display:block;width:100%;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}nav{position:fixed;z-index:20;top:20px;left:24px;right:24px;display:flex;justify-content:flex-end;gap:3px;overflow:auto}nav a{color:var(--muted);text-decoration:none;font:600 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:10px;border-bottom:2px solid transparent;white-space:nowrap}nav a.active{color:var(--ink);border-color:var(--accent)}main{position:relative;z-index:10}.chapter{height:225vh;display:flex;align-items:center;padding:8vw;pointer-events:none}.chapter:nth-child(even){justify-content:flex-end}.copy{position:sticky;top:30vh;width:min(650px,75vw);text-shadow:0 2px 25px #000}.eyebrow{color:var(--accent);font:700 12px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}.copy h1,.copy h2{font-size:clamp(44px,7vw,110px);line-height:.92;letter-spacing:-.045em;margin:0;max-width:11ch}.copy p{font:400 clamp(16px,1.4vw,21px)/1.6 Arial,sans-serif;color:var(--muted);max-width:40ch}.badge{position:fixed;z-index:22;left:18px;bottom:16px;padding:9px 12px;border:1px solid #ffffff2c;background:#0c0a079e;color:var(--muted);font:600 10px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}@media(max-width:760px){nav{justify-content:flex-start;left:8px;right:8px}.chapter,.chapter:nth-child(even){height:190vh;align-items:flex-end;justify-content:flex-start;padding:22px 22px 20vh}.copy{top:54vh;width:100%}.copy h1,.copy h2{font-size:clamp(42px,13vw,68px)}.shade{background:linear-gradient(0deg,rgba(10,8,5,.86),rgba(10,8,5,.08) 68%)}}</style></head><body><div class="stage" aria-hidden="true"><div id="media"></div><div class="shade"></div></div><div class="progress"><i id="bar"></i></div><nav id="nav"></nav><main id="story"></main><div class="badge">GitHub preview · shaking effect removed</div><script>const branch='feature/glitch-wave-smooth-scroll';const base='https://raw.githubusercontent.com/MunzFX/as-salaam-recitations/'+branch+'/app/public/assets/world/';const chapters=[['Invitation','Begin with listening.','Enter a quiet cinematic journey through Qur’an recitations.'],['Featured recording','A voice carried through the Qur’an.','Listen with focus as the architecture and film move gently with your scroll.'],['Browse Surahs','Every Surah, carefully arranged.','Explore the complete collection in a calm, considered space.'],['A space to listen','Let the world grow quiet.','The animated background remains intact without the unstable liquid shake.'],['All recordings','Every chapter. A new return.','Move through the archive and return to the recitations that stay with you.'],['Private archive','Your voice. Preserved.','A personal space for recordings, listening history and reflection.']];const media=document.getElementById('media'),story=document.getElementById('story'),nav=document.getElementById('nav'),bar=document.getElementById('bar');chapters.forEach((c,i)=>{const n=String(i+1).padStart(2,'0');const f=document.createElement('figure');f.className='scene'+(i?'':' active');f.innerHTML='<img alt="" src="'+base+'journey-hq-'+n+'-poster.webp"><video muted playsinline preload="metadata" poster="'+base+'journey-hq-'+n+'-poster.webp"><source src="'+base+'journey-hq-'+n+'.mp4" type="video/mp4"></video>';media.append(f);const s=document.createElement('section');s.className='chapter';s.id='chapter-'+i;s.innerHTML='<div class="copy"><p class="eyebrow">'+String(i+1).padStart(2,'0')+' · '+c[0]+'</p><'+(i?'h2':'h1')+'>'+c[1]+'</'+(i?'h2':'h1')+'><p>'+c[2]+'</p></div>';story.append(s);const a=document.createElement('a');a.href='#chapter-'+i;a.textContent=c[0];if(!i)a.className='active';nav.append(a)});const scenes=[...document.querySelectorAll('.scene')],videos=scenes.map(x=>x.querySelector('video')),links=[...nav.querySelectorAll('a')];let target=0,current=0,last=-1;function read(){const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);target=scrollY/max;bar.style.transform='scaleX('+target+')'}function frame(){current+=(target-current)*.075;const p=current*chapters.length,i=Math.min(chapters.length-1,Math.floor(p)),local=Math.min(.999,Math.max(0,p-i));if(i!==last){scenes.forEach((s,x)=>s.classList.toggle('active',x===i));links.forEach((a,x)=>a.classList.toggle('active',x===i));last=i}const v=videos[i];if(v&&Number.isFinite(v.duration)&&v.duration>0&&!v.seeking){const t=local*v.duration;if(Math.abs(v.currentTime-t)>.035)try{v.currentTime=t}catch{}}requestAnimationFrame(frame)}addEventListener('scroll',read,{passive:true});addEventListener('resize',read);read();requestAnimationFrame(frame);</script></body></html>
